services:
  - type: web
    name: groq-chat
    runtime: python
    buildCommand: npm ci --include=dev && npm run build && npm run setup:python
    startCommand: .venv/bin/python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: NODE_VERSION
        value: "22.12.0"
      - key: GROQ_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
