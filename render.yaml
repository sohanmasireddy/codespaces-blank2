services:
  - type: web
    name: groq-chat
    runtime: python
    buildCommand: npm ci --include=dev && npm run build && python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
